  ${redPane} { slot: "7-8" },
  ${redPane} { slot: "9" },
  ${redPane} { slot: "17" },
  ${redPane} { slot: "18" },
  ${redPane} { slot: "26" },
  ${redPane} { slot: "27" },
  ${redPane} { slot: "35" },
  ${redPane} { slot: "36-37" },
  ${redPane} { slot: "43-44" }
