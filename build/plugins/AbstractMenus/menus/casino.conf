redPane {
  material: RED_STAINED_GLASS_PANE
  name: ""
  click {
    sound: "BLOCK_GLASS_BREAK"
    }
}

orangePane {
  material: ORANGE_STAINED_GLASS_PANE
  name: ""
  click {
    sound: "BLOCK_GLASS_BREAK"
    }
}

air {
  material: AIR
}

roulette {
  material: DIAMOND
  name: "<#D51515>[$] <#FF6600>Алмазная рулетка"
  lore: [
  "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы играть",
  "",
  "<#FFFFE6>Испытайте свою удачу, сыграв",
  "<#FFFFE6>в рулетку с ценными ресурсами,",
  "<#FFFFE6>которые приумножают Вашу ставку!"
]
  click {
    command { player: "casinoroulette" }
	sound: "ENTITY_ARROW_SHOOT"
  }
}

treasure {
  material: TNT
  name: "<#D51515>[$] <#FF6600>Кладоискатель"
  lore: [
  "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы играть",
  "",
  "<#FFFFE6>Мы спрятали от Вас различные",
  "<#FFFFE6>ценные ресурсы, найдя которые,",
  "<#FFFFE6>Вы сможете разбогатеть, но,",
  "<#FFFFE6>если наткнетесь на динамит,",
  "<#FFFFE6>в миг все потеряете!"
]
  click {
    command { player: "casinotreasure" }
	sound: "ENTITY_ARROW_SHOOT"
  }
}

horse {
  material: LEATHER_HORSE_ARMOR
  flags: [
    "HIDE_DYE",
    "HIDE_ENCHANTS",
]
  color: "#FF6600"
  name: "<#D51515>[$] <#FF6600>Конные скачки"
  lore: [
  "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы играть",
  "",
  "<#FFFFE6>Захватывающая азартная игра,",
  "<#FFFFE6>позволяющая заработать на своей",
  "<#FFFFE6>лошадке, если та придет к финишу",
  "<#FFFFE6>быстрее всех!"
]
  click {
    command { player: "casinoracing" }
	sound: "ENTITY_ARROW_SHOOT"
  }
}