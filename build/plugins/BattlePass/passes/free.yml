name: 'Бесплатный'
default-points-required: 100
dont-give-premium-free-rewards: false # true - игроки с Premium Battle Pass не будут получать награды из Free Battle Pass

items:
  doesnt-have-pass-item: # Иконка, которая будет показана игроку с Premium Battle Pass при dont-give-premium-free-rewards: true
    material: 'minecart:0'
    name: '&eУровень #%tier%'
    lore:
      - ''
      - '&cТы можешь забирать только премиум награды'
  locked-tier-item:
    material: 'hopper_minecart:0'
    name: '&f[Уровень #%tier%] &cНе пройден'
    lore:
      - ''
      - '&fНаграды:'
      - '&c%lore_addon%'
      - ''
  unlocked-tier-item:
    material: 'chest_minecart:0'
    name: '&f[Уровень #%tier%] &aРазблокировано'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''
  claimed-tier-item:
    material: 'minecart:0'
    name: '&f[Уровень #%tier%] &aПолучено'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''

tier-up-actions:
  - '[message] {&7Ты достиг уровня &e%tier% в &eБатл-Пассе}'

