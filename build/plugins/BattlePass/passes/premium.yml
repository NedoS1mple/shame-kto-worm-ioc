name: '&cПремиум'
default-points-required: 100
#Право на Premium Battle Pass: 'battlepass.premium'

items:
  doesnt-have-pass-item: # Иконка награды Premium Battle Pass, отображаемая при отсутствии Premium Battle Pass
    material: 'tnt_minecart:0'
    #customModelData: 0 # Custom model data
    name: '&f[Уровень #%tier%] &cНедоступно'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''
      - '&cПремиум награда '
  locked-tier-item: # Иконка уровня, до которого не дошёл игрок
    material: 'hopper_minecart:0'
    name: '&f[Уровень #%tier%] &cНе пройдено'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''
      - '&cПремиум награда '
  unlocked-tier-item:
    material: 'chest_minecart:0'
    name: '&f[Уровень #%tier%] &aРазблокировано'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''
      - '&cПремиум награда '
  claimed-tier-item:
    material: 'minecart:0'
    name: '&f[Уровень #%tier%] &aПолучено'
    lore:
      - ''
      - '&fНаграды:'
      - '&a%lore_addon%'
      - ''
      - ' &cПремиум награда '

tier-up-actions:
  - '[message] {&7Ты достиг уровня &e%tier% в &eBattlePass}'

