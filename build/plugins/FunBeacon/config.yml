# Настройки маяка
beacon:
  disabledWorlds:
    - world_nether
    - world_the_end
  lifetime: 120 # Время жизни маяка в секундах
  activate_lifetime: 80 # Время активации маяка
  platform:
    material: GOLD_BLOCK # Материал платформы под маяком
    size: 5 # Размер платформы (5x5 блоков)
  hologram:
    platform_build_holo: '&#B908FBПостройка платформы...' #Текст голограммы постройки платформы
    timeText: '&fДо закрытия: §x§E§6§8§9§0§0{time} сек' # Текст голограммы с временем
    beacon_activate_holo: '§fДо активации: §x§E§6§8§9§0§0{time} сек' # Текст голограммы с временем активации
    activebeacon: '' #Текст голограммы названия маяка (активация)
    titleText: '&#151515&k |||&#F79C00   &D[Загадочный маяк]   &#151515&k |||' #Текст голограммы названия маяка
    height: 2.0 # Высота голограммы над маяком

# Настройки экономики
economy:
  baseAmount: 55.0 # Базовое количество монет за нахождение рядом с маяком
  distanceMultiplier: 10.0 # Множитель награды в зависимости от расстояния
  doubleRewardInterval: 10 # Интервал в секундах, через который награда удваивается

# Настройки частиц
particles:
  type: LAVA # Тип частиц
  count: 30 # Количество частиц
  radius: 0.5 # Радиус разброса частиц
  interval: 10 # Интервал в секундах, через который появляются частицы
sound:
  activate_sound: entity.ender_dragon.ambient # звук при спавне маяка
  timer_sound: block.stone_button.click_off # звук таймера активации маяка
  active_beacon_sound: entity.player.levelup # звук активации маяка
