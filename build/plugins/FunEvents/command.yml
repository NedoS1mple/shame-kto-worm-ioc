usage:
  - "&c[Ивенты]"
  - "&c/event delay &6- Время до следующего ивента"
  - "&c/event gps &6- Настроить компас на место ивента"
#Сообщения при /events delay
delay:
  #То, что будет писаться сверху
  header: "&c[Ивенты]"
  #Нет ивентов
  no-event:
    - "&c[1] &6До следующего ивента: &c{timeleft} сек"
  start:
    - "&c[{i}] &6{name}: "
    - "&c|| &fСтатус: &e» Ивент появился, до начала &#FFFF55{timer} &eсек"
    - "&c|| &fКоординаты: &6{cords}"
  duration:
    - "&c[{i}] &6{name}:"
    - "&c|| &fСтатус: &e» Ивент начался, до окончания &#FFFF55{timer} &eсек"
    - "&c|| &fКоординаты: &6{cords}"  
  end:
    - "&c[{i}] &6{name}:"
    - "&c|| &fСтатус: &e» Ивент закончился, удаление через &#FFFF55{timer} &eсек"
    - "&c|| &fКоординаты: &6{cords}"
  prestart:
    - "&c[{i}] &6{name}: "
    - "&c|| &fСтатус: &e» Еще не появился, появится через &#FFFF55{timer} &eсек"
  remove:
    - "&c[{i}] &6{name}:"
    - "&c|| &fСтатус: Удаление"
    - "&c|| &fКоординаты: &6{cords}"
gps:
  toggle: true
  command: "gps {cords}"
  message:
    off: "&c[Ивенты] &6Команда выключена на данном сервере"
    no-events: "&c[Ивенты] &6Активных ивентов сейчас нет. &6Введите &c&n/event delay&6, чтобы узнать до следующего ивента"