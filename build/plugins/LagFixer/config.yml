# 
# Some of the options below require a server restart or plugin reload.
main:
  prefix: '&8[&e&l⚡&8] '
  prefix_hover: true
  threads: 1
  monitor_interval: 5
  map_interval: 3
  errors_reporter: true
  updater: true
  warnings: true
  bStats: true
  config_auto_fix: true
  command:
    permission: lagfixer.command
    aliases:
    - lf
    - antilag
    - lag
modules:
  MobAiReducer:
    enabled: true
    worlds:
    - '*'
    values:
      collides: true
      silent: true
      async: true
      force_load: true
      click_event: true
      purge_interval: 30
      ignore_models: true
      spawn_reasons:
      - NATURAL
      - SPAWNER_EGG
      - SPAWNER
      - EGG
      - BREEDING
      - DISPENSE_EGG
      - ENDER_PEARL
      - COMMAND
      entities:
        animals: true
        monsters: true
        villagers: true
        tameable: false
        birds: false
        others: true
      blacklist:
      - WOLF
      - MOOSHROOM
      - IRON_GOLEM
      pathfinder:
        typeA:
          enabled: true
          whitelist:
          - AttackableTarget
          - HurtByTarget
          - Attack
          - BowShoot
          - Swell
          - Eat
          - FishSchool
          - Sit
          - FollowOwner
        typeB:
          enabled: false
          blacklist:
          - Random
          - LookAt
          - Panic
          - AvoidTarget
          - MoveTowards
        typeC:
          enabled: false
      animals:
        tempt:
          enabled: true
          range: 6.25
          speed: 1.25
          cooldown: 30
          villagers: true
          trigger_both_hands: true
          event: false
          teleport: false
        breed:
          enabled: true
          range: 5.0
          speed: 1.0
          event: false
          teleport: false
        panic:
          enabled: true
          rangeFromPlayer: 7
          speed: 1.95
          cooldown: 15
  VehicleMotionReducer:
    enabled: false
    worlds:
    - '*'
    values:
      force_load: false
      minecart:
        enabled: true
        remove_chest: false
      boat:
        enabled: true
  LagShield:
    enabled: true
    worlds:
    - world
    - world_the_end
    - world_nether
    values:
      tps_threshold:
        entity_spawn: 16
        tick_hopper: 18
        redstone: 18
        projectiles: 15
        leaves_decay: 19
        mobai: -1
        liquid_flow: 17
        random_tick_speed: 18.5
        explosions: 18.5
        fireworks: 17
      dynamic_view_distance:
        enabled: false
        tps_thresholds:
          '20': 10
          '18': 8
          '15': 6
          '10': 4
      dynamic_simulation_distance:
        enabled: false
        tps_thresholds:
          '20': 5
          '18': 4
          '15': 3
          '10': 1
  ConsoleFilter:
    enabled: false
    values:
      logs_limit: 10
      filter:
        enabled: false
        save_filtered: true
        error_filtering: false
        patterns:
        - ^<(([A-Za-z0-9_]{3,16}))> (.{0,})
        - ^/([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\:([0-9]{1,5}) lost
          connection
        - Reached end of stream for /([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$
        - '([A-Za-z0-9_]{3,16}) issued server command: /(.{0,})'
        - Read timed out
        - ^.*logged in with entity id ([0-9]{0,}) at.*$
        - '([A-Za-z0-9_]{3,16}) lost connection: Disconnected'
        - ^(§e)([A-Za-z0-9_]{3,16}) left the game.
        - Connection reset
        - 'CONSOLE: Forcing save\.\..*'
        - 'CONSOLE: Save complete\..*'
  RedstoneLimiter:
    enabled: true
    worlds:
    - '*'
    values:
      alerts: true
      ticks_limit:
        redstone: 1100
        piston: 50
      break_block:
        redstone: false
        piston: false
      piston:
        push_blacklist:
        - SAND
        - RED_SAND
        - GRAVEL
      click_cooldown: 1500
  EntityLimiter:
    enabled: false
    worlds:
    - '*'
    values:
      alerts: false
      whitelist:
      - VILLAGER
      - ZOMBIE_VILLAGER
      - ENDER_DRAGON
      - WITHER
      perchunk:
        enabled: true
        ignore_models: true
        creatures: 15
        items: -1
        vehicles: 3
        projectiles: 5
        tiles: 10
        reasons:
        - DEFAULT
        - EGG
        - NATURAL
        - SPAWNER
        - SPAWNER_EGG
        - COMMAND
        overflow_purge:
          enabled: false
          interval: 30
          limit_multiplier: 1.5
          types:
            creatures: true
            items: false
            vehicles: true
            projectiles: true
            named: false
      perworld:
        enabled: true
        monsters: 40
        animals: 20
        water_animals: 5
        water_ambient: 0
        water_underground_creature: 5
        axolotls: 5
        ambient: 0
  WorldCleaner:
    enabled: false
    worlds:
    - world
    - world_the_end
    - world_nether
    values:
      interval: 240
      alerts: true
      items:
        enabled: true
        disable_item_despawn: false
        time_lived: 10000
        blacklist:
        - BEACON
        abyss:
          enabled: false
          alerts: true
          permission: lagfixer.abyss
          item_despawn: true
          close: 60
          blacklist:
          - BEDROCK
          - BEACON
      creatures:
        enabled: true
        named: false
        drop_items: false
        stacked: true
        levelled: true
        babies: false
        ignore_models: true
        list_mode: true
        list:
        - BAT
        - ZOMBIE
        - SKELETON
        - SLIME
        - CREEPER
        - SPIDER
        - PHANTOM
        - SILVERFISH
        - SQUID
        - GLOW_SQUID
        - COD
        - SALMON
        - PUFFERFISH
        - TROPICAL_FISH
      projectiles:
        enabled: true
        blacklist:
        - ENDER_PEARL
        - EXPERIENCE_BOTTLE
        - FIREBALL
        - POTION
        - LINGERING_POTION
        - SPLASH_POTION
        - WITHER_SKULL
        - TRIDENT
  InstantLeafDecay:
    enabled: true
    worlds:
    - world
    values:
      drop_items: true
      tree_distance: 7
      leaves_decay: true
  AbilityLimiter:
    enabled: true
    worlds:
    - '*'
    values:
      elytra_boost:
        cooldown: 3
        speed_multiplier: 0.85
        additional_durability_loss: 5
      trident_riptide:
        cooldown: 3
        speed_multiplier: 0.85
        additional_durability_loss: 5
  ExplosionOptimizer:
    enabled: false
    worlds:
    - '*'
    values:
      yield_limit:
        enabled: false
        default: 4.0
        per_entity:
          TNT: 4.0
          TNT_MINECART: 4.0
          CREEPER: 3.0
          FIREBALL: 1.0
          WITHER_SKULL: 1.0
          END_CRYSTAL: 6.0
      anti_chain:
        enabled: true
        prevent_tnt_chains: true
        prevent_creeper_chains: false
        prevent_crystal_chains: true
        prevent_block_ignition: true
        chain_radius: 8.0
        max_chain_size: 3
        chain_cooldown: 1000
      management:
        enabled: false
        cancel_block_explosions: true
        cancel_creepers: false
        cancel_crystals: true
        cancel_fireballs: true
        cancel_tnt: true
        cancel_wither_skulls: true
        explosion_damage: false
        explosion_sound: true
