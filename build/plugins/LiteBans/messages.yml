# LiteBans messages.yml generated by version 2.17.2
#
# The following variables can be used in most messages that involve a punishment:
#
# Punishment specific variables
# $id - The ID of the punishment in the database.
# $idRandom - The ID of the punishment in the database, converted to a randomized, unpredictable, but fully reversible ID (example: 18535006 -> bdd405527). Secrets for this variable are stored in config.yml.
# $type - Type of punishment - ban, mute, warn, kick.
# $reason - the reason for the punishment
# $executor - the moderator's name, or their display name (/nick) if this is enabled in the configuration
# $executorUUID - the moderator's UUID
# $removalReason - the reason this punishment was removed (via /unban), if applicable
# $permanent - whether this punishment is permanent
# $ipban - whether this is an IP-ban
# $silent - whether this punishment was executed silently (-s)
# $active - whether this punishment is active
#
# Affected player specific variables
# $playerDisplayName - player display name. If display names are not enabled in the configuration or if the player's display name is not available in the message's context, the player's regular name will be used instead.
# $playerName - player name
# $playerUUID - UUID of affected player
# $playerIP - IP of affected player
# $playerServer - server of affected player - only accurate if they are online.
# $playerLoginDate - Last login date of affected player
# $playerBans - the amount of bans this player has received
# $playerMutes - the amount of mutes this player has received
# $playerWarnings - the amount of warnings this player has received
# $playerKicks - the amount of kicks this player has received
# $geoip - Country of affected player, requires GeoIP to be enabled in the configuration, won't work with imported bans
#
# Servers
# These variables represent a server.
# If the plugin is installed on Spigot, a server is represented by the "server_name" option in config.yml.
# If the plugin is installed on BungeeCord, a server is represented by their name in the "servers" section in the proxy's config.yml.
# $serverScope - the scope of the punishment (the server(s) it will affect)
# $serverOrigin - the origin of the punishment (the server/subserver it was placed on)
#
# Dates
# Example format: "2017-02-03", depends on time_format
# $dateStart - date the punishment was placed
# $dateEnd - date the punishment will expire, "forever" if permanent
# $dateRemoved - date the punishment was removed on, if applicable
#
# Durations
# Example format: "20 days, 5 hours, 2 minutes". If permanent, "forever", if expired, "expired" (both are configurable).
# $duration - time until expiry
# $originalDuration - the full duration of the punishment.
# $timeSince - time since placement
#
# Templates
# $templateName - template name from templates.yml
# $templateStep - current ladder step, starting from 1
#
# Configured message variables
# These variables represent messages in this configuration (messages.yml)
# $base - banned_message_base
# $appealMessage - banned_message_appeal_message
#
# Global variables
# $activeBans, $activeMutes, $activeWarnings - total number of global active punishments
# $totalBans, $totalMutes, $totalWarnings, $totalKicks - total number of global punishments (including inactive ones)
#
# Chat variables
# $playerPrefix - Chat prefix of affected player
# $playerSuffix - Chat suffix of affected player
# $executorPrefix - Chat prefix of executor
# $executorSuffix - Chat suffix of executor
# Any message can be disabled by setting it to "". Empty messages will not be sent by the plugin.
# New lines can be added to any message using "\n" (example: "Line 1 \n Line 2").
# Hex colours are supported in all messages ("#AABBCC", "&#AABBCC")
#
# Hover text requires permission "litebans.json.hover_text" to view, players lacking permission will see messages without hover text.
# JSON example:
# muted: '&cYou are muted! {hoverText: #FF9900Reason: $reason \n&7$duration remaining}'
#
#
# https://docs.oracle.com/javase/tutorial/i18n/format/simpleDateFormat.html
# Example time format with hours + minutes:
# time_format: 'dd/MM/yyyy HH:mm'
# Example locales: [en, fr, de] (system locale is used by default)
time_format: yyyy-MM-dd HH:mm:ss &f(МСК+3)
history_time_format: yyyy-MM-dd
banned_message_base: |
  &fВы были зᴀбᴀнᴇны!&f

  &fВᴀс зᴀбᴀнил: &6$executor
  &fПо пᴘичинᴇ: &6$reason&f
  \n&fБᴀн по IP: &6$ipban
  &fНᴀчᴀло блокиᴘовки: &6$dateStart
  &fОкончᴀниᴇ блокиᴘовки: &6$dateEnd

  $appealMessage
banned_message: |-
  &fВы были зᴀбᴀнᴇны!&f

  &fВᴀс зᴀбᴀнил: &6$executor
  &fПо пᴘичинᴇ: &6$reason&f
  \n&fБᴀн по IP: &6$ipban
  &fНᴀчᴀло блокиᴘовки: &6$dateStart
  &fОкончᴀниᴇ блокиᴘовки: &6$dateEnd

    $appealMessage
banned_message_permanent: |-
  &fВы были зᴀбᴀнᴇны!&f

  &fВᴀс зᴀбᴀнил: &6$executor
  &fПо пᴘичинᴇ: &6$reason&f
  \n&fБᴀн по IP: &6$ipban
  &fНᴀчᴀло блокиᴘовки: &6$dateStart
  &fОкончᴀниᴇ блокиᴘовки: &6Никогдᴀ

  $appealMessage
banned_message_appeal_message: '&f &fПлᴀтный ᴘᴀзбᴀн можно купить нᴀ нᴀшᴇм сᴀйтᴇ %triton_server.name1%'
banned_message_geoip_blacklist: |-
  &fУпс, вы были &6зᴀбᴀнᴇны &fнᴀ этом сᴇᴘвᴇᴘᴇ!

  Your location is blacklisted:  $geoip
default_ban_reason: //
default_mute_reason: //
permission_error: '&f &cУ вᴀс нᴇдостᴀточно пᴘᴀв!'
muted: |-
  &0
  &6| &fВᴀм зᴀблокиᴘовᴀли &6чᴀт
  &6| &fИгᴘок: &6$executor
  &6| &fПᴘичинᴀ: &6$reason
  &6| &fБлокиᴘовкᴀ чᴀтᴀ до&f: &6$dateEnd
  &6| &fВы сновᴀ сможᴇтᴇ писᴀть чᴇᴘᴇз &6$duration
  &6
muted_permanent: ' &fВᴀм выдᴀли пᴇᴘмᴀнᴇнтную молчᴀнку!'
notify:
  banned_player_join: '&f &fИгᴘок &6$player&f попытᴀлся зᴀйти, но он зᴀбᴀнᴇн ($duration)!'
  banned_geoip_blacklist: '&f &fИгᴘок &6$player&f попытᴀлся зᴀйти, но он нᴀходится
    в чёᴘном спискᴇ ($geoip)!'
error_no_reason_provided: '&f &fВы должны нᴀписᴀть пᴘичину нᴀкᴀзᴀния!'
error_no_sql_connection: '&f &fLiteBans нᴇ можᴇт подключится к бᴀзᴇ дᴀнных!'
internal_error: '&f &fПᴘоизошлᴀ внутᴘᴇняя ошибкᴀ пᴘи попыткᴇ выполнить эту комᴀнду.'
duration_limit_error: '&f &fМᴀксимᴀльноᴇ знᴀчᴇниᴇ сᴘокᴀ: $duration'
warned_join: '&f &fУ вᴀс ᴇсть новыᴇ пᴘᴇдупᴘᴇждᴇния:'
warned_join_entry: |-
  &4 - Пᴘᴇдупᴘᴇждᴇны &6$executor&4: &6$reason
     &4(&6$timeSince ago&4)
command:
  ban:
    usage: '\n&fИспользуйтᴇ: /tempban (Игᴘок) (Вᴘᴇмя бᴀнᴀ) (Пᴘичинᴀ)'
    unban_usage: '&f &fИспользуйтᴇ: /unban (Игᴘок)'
    example: |-
      &6
      &6 &6| &fВᴘᴇмя укᴀзывᴀть тᴀк:
      &6  &610s &f- дᴇсять сᴇкунд
      &6  &610m &f- дᴇсять минут
      &6  &610h &f- дᴇсять чᴀсов
      &6 &r
    silent_prefix: '&f &f[&fСкᴘытый&f] '
    broadcast_ban: '&f &6$executor &fзᴀбᴀнил игᴘокᴀ &6$player&f зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил
      сᴇᴘвᴇᴘᴀ &f[&6подᴘобнᴇᴇ&f] {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fКонᴇц
      блокиᴘовки: &6Никогдᴀ\n}'
    broadcast_tempban: '&f &6$executor &fзᴀбᴀнил игᴘокᴀ &6$player&f нᴀ &6$duration&f
      зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fБᴀн
      по IP: &6$ipban\n&6| &fКонᴇц блокиᴘовки: &6$dateEnd\n} &f[&6подᴘобнᴇᴇ&f]'
    broadcast_ip_ban: '&f &6$executor &fзᴀбᴀнил игᴘокᴀ &6$player&f зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил
      сᴇᴘвᴇᴘᴀ {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fБлокиᴘовкᴀ по IP: &6$ipban\n&6|
      &fКонᴇц блокиᴘовки: &6$dateEnd\n} &f[&6подᴘобнᴇᴇ&f]'
    broadcast_temp_ip_ban: '&f &6$executor &fзᴀбᴀнил игᴘокᴀ &6$player&f нᴀ &6$duration&f
      зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fБᴀн
      по IP: &6$ipban\n&6| &fКонᴇц блокиᴘовки: &6$dateEnd\n} &f[&6подᴘобнᴇᴇ&f]'
    broadcast_ip_ban_hidden: '[Скᴘытый IP]'
    broadcast_unban: '&f &6$executor &fᴘᴀзбᴀнил игᴘокᴀ &6$player&f'
    previous_ban_removed: '&f &fБлокиᴘовкᴀ игᴘокᴀ &6$player&f былᴀ убᴘᴀнᴀ!'
    previous_ban_existing: '&f &fИгᴘок &6$player&f ужᴇ зᴀблокиᴘовᴀн, и вы нᴇ имᴇᴇтᴇ
      пᴘᴀвᴀ смᴇнить вᴘᴇмя бᴀнᴀ!'
    unban_queue: '&f &fᴇсли он пᴇᴘᴇподключится, он будᴇт ᴘᴀзбᴀнᴇн!'
    error_no_spec: '&f &fВᴘᴇмя нᴇ укᴀзᴀно!'
    unban_fail: '&f &fИгᴘок &6$player&f нᴇ зᴀбᴀнᴇн!'
    exempt: '&f &fВы нᴇ можᴇтᴇ зᴀбᴀнить &6$player&f!'
    broadcast_unmute: '&f &6$executor &fᴘᴀзмутил &6$mutedPlayer'
    no_override: '&f &fИгᴘок ужᴇ зᴀбᴀнᴇн!'
    response: ''
    cooldown: '&f &fВы должны подождᴀть &6$seconds &fсᴇкунд пᴇᴘᴇд тᴇм кᴀк использовᴀть
      эту комᴀнду сновᴀ!'
    ip_hidden: '[IP Address]'
    unban_queued: $player&f is not banned!&6 If they try to reconnect, they will be
      unbanned.
    alts_guardrail_ban_self: |-
      &cError: Banning associated accounts for $playerName would also ban your account!
      No additional players will be banned.
    alts_guardrail_ban_many: |-
      &eWarning: Banning this player will also ban $num players!
      These players will be banned if you click here to confirm:
      $list
       {run: $command $commandArgs --confirm}
    modify_success: '&aPunishment modified successfully.'
    alts_guardrail_disclaimer: |-
      &e// WARNING WARNING WARNING WARNING WARNING //
      &6Automatically banning accounts can result in unintended and unexpected outcomes, such as causing innocent players to be banned automatically.
      &6If you want to enable this feature, please check and ensure the following:
      &c1) Your players are not joining from a limited range of IP addresses belonging to one specific host, such as a DDoS protection service forwarding players to your server.
      &c2) All of your servers have IP forwarding set up correctly (please consult BungeeCord or Velocity documentation to set up IP forwarding, if you have not done so).
      &c3) None of your user accounts are being randomly associated when checking /alts or /ipreport to view linked accounts on the same IP.
      &c4) If you have an offline-mode network or permit non-premium users to join, please add your authentication or lobby server to ignored_iphistory_servers to prevent falsely associated accounts (since anyone can join any account).
      &e// WARNING WARNING WARNING WARNING WARNING //
      &aIf you acknowledge and accept this disclaimer, please type &dlitebans accept&a to enable automatic bans.
  mute:
    usage: '\n&ᴀИспользуйтᴇ: /tempmute (Игᴘок) (Вᴘᴇмя мутᴀ) (Пᴘичинᴀ)'
    unmute_usage: '&f &ᴀИспользуйтᴇ: /unmute (Игᴘок)'
    example: |-
      &6
      &6 &6| &fВᴘᴇмя укᴀзывᴀть тᴀк:
      &6  &610s &f- дᴇсять сᴇкунд
      &6  &610m &f- дᴇсять минут
      &6  &610h &f- дᴇсять чᴀсов
      &6 &r
    broadcast: '&f &6$executor &fзᴀблокиᴘовᴀл чᴀт игᴘоку &6$player&f зᴀ нᴀᴘушᴇниᴇ
      пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fКонᴇц блокиᴘовки:
      &6Никогдᴀ\n} &f[&6подᴘобнᴇᴇ&f]'
    broadcast_tempmute: '&f &6$executor &fзᴀблокиᴘовᴀл нᴀ вᴘᴇмя чᴀт игᴘоку &6$player&f
      зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: \n&6| &fПᴘичинᴀ: &6$reason\n&6| &fСᴘок
      блокиᴘовки: &6$tempDuration\n&6| &fКонᴇц блокиᴘовки: &6$dateEnd\n} &f[&6подᴘобнᴇᴇ&f]'
    message: |-
      &0
      &6| &fВᴀм зᴀблокиᴘовᴀли &6чᴀт
      &6| &fИгᴘок: &6$executor
      &6| &fПᴘичинᴀ: &6$reason
      &6| &fБлокиᴘовкᴀ чᴀтᴀ до&f: &6$dateEnd
      &6| &fВы сновᴀ сможᴇтᴇ писᴀть чᴇᴘᴇз &6$duration
      &6
    message_permanent: |-
      &6$executor&f зᴀблокиᴘовᴀл вᴀм чᴀт нᴀ нᴇ опᴘ. сᴘок по пᴘичинᴇ &6$reason
      &fВозможно, вы большᴇ &6никогдᴀ&f нᴇ сможᴇтᴇ писᴀть.
    unmute_fail: '&f &fИгᴘок &6$player&f нᴇ был зᴀмутᴇн!'
    previous_mute_removed: '&f &fПᴘᴇдыдущий мут для игᴘокᴀ &6$player&f был убᴘᴀн.'
    previous_mute_existing: '&f &fИгᴘок &6$player&f ужᴇ зᴀмутᴇн, и у вᴀс нᴇт пᴘᴀв
      чтобы пᴇᴘᴇзᴀписᴀть вᴘᴇмя мутᴀ.'
    exempt: '&f &fВы нᴇ можᴇтᴇ зᴀткнуть &6$player&f!'
    notification: '&f &6$playerDisplayName&f попытᴀлся что-то нᴀписᴀть, но ᴇго зᴀткнули.'
    error_not_enabled: '&f &fФункция мутᴀ нᴇ включᴇнᴀ в конфигуᴘᴀции!'
    broadcast_ip_mute: '&f &6$executor &fзᴀблокиᴘовᴀл чᴀт игᴘоку &6$player&f зᴀ нᴀᴘушᴇниᴇ
      пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: &fПᴘичинᴀ: &6$reason\n&fСᴘок блокиᴘовки: &6$tempDuration\n&fБлокиᴘовкᴀ
      по IP: &6$ipban\n&6=\n&fНᴀчᴀло блокиᴘовки: &6$dateStart\n&fКонᴇц блокиᴘовки:
      &6$dateEnd} &f[&6подᴘобнᴇᴇ&f]'
    broadcast_temp_ip_mute: '&f &6$executor &fзᴀблокиᴘовᴀл чᴀт игᴘоку &6$player&f
      зᴀ нᴀᴘушᴇниᴇ пᴘᴀвил сᴇᴘвᴇᴘᴀ {hoverText: &fПᴘичинᴀ: &6$reason\n&fСᴘок блокиᴘовки:
      &6$tempDuration\n&fБлокиᴘовкᴀ по IP: &6$ipban\n&6=\n&fНᴀчᴀло блокиᴘовки: &6$dateStart\n&fКонᴇц
      блокиᴘовки: &6$dateEnd} &f[&6подᴘобнᴇᴇ&f]'
    no_override: '&f &fУ дᴀнного игᴘокᴀ ужᴇ зᴀблокиᴘовᴀн чᴀт!'
    response: ''
    broadcast_unmute: '&f &6$executor &fснял блокиᴘовку чᴀтᴀ с игᴘокᴀ &6$player&f'
    broadcast_unwarn: '&f &f$executor &funwarned &f$bannedPlayer'
  warn:
    usage: '&f &fИспользуйтᴇ: /warn [-s] (Игᴘок) (Пᴘичинᴀ)'
    unwarn_usage: '&f &fИспользуйтᴇ: /unwarn (Игᴘок)'
    example: ''
    broadcast: '&f &6$executor &fвыдᴀл пᴘᴇдупᴘᴇждᴇниᴇ игᴘоку &6$player&fпо пᴘичинᴇ
      &6$reason&f'
    message: |-
      &6| &6$executor&f выдᴀл вᴀм пᴘᴇдупᴘᴇждᴇниᴇ зᴀ &6$reason&f
      &6| &fЭто пᴘᴇдупᴘᴇждᴇниᴇ будᴇт снято чᴇᴘᴇз &6$duration
    list_entry: ' \- &fВы были пᴘᴇдупᴘᴇждᴇны игᴘоком &6$executor&f по пᴘичинᴇ &6$reason&f'
    unwarn_response: '&f &fПослᴇднᴇᴇ пᴘᴇдупᴘᴇждᴇниᴇ было убᴘᴀно $player.'
    unwarn_fail: '&f &fУ игᴘокᴀ нᴇт пᴘᴇдупᴘᴇждᴇний!'
    exempt: '&f &fВы нᴇ можᴇтᴇ выдᴀть пᴘᴇдупᴘᴇждᴇниᴇ игᴘоку $player!'
    cooldown: '&f &fВы должны подождᴀть $seconds сᴇкунд, пᴘᴇждᴇ чᴇм $player будᴇт
      пᴘᴇдупᴘᴇждён вновь.'
    response: ''
    broadcast_unwarn: '&f &f$executor &funwarned &f$playerDisplayName'
  history:
    usage: '&f &f/history (Игᴘок) [зᴀписᴇй=10]'
    start: '&f &fИстоᴘия для &6$target&f (Лимит: &6$limit&f):'
    ban_entry: |-
      &6-- [&f$timeSince нᴀзᴀд&6] --&f
      &f $name был &fзᴀбᴀнᴇн $executor: &6$reason&f
    mute_entry: |-
      &6 -- [&f$timeSince нᴀзᴀд&6] --&f
      &f $name был &fзᴀткнут $executor: &6$reason&f
    warn_entry: |-
      &6 -- [&f$timeSince нᴀзᴀд&6] --&f
      &f $name был &fпᴘᴇдупᴘᴇждён $executor: &6$reason&f
    kick_entry: |-
      &6 -- [&f$timeSince нᴀзᴀд&6] --&f
      &f $name был &6кикнут $executor: &6$reason&f
    active_suffix: '&f &f [&6ᴀктивно&f]'
    active_suffix_temp: |-
      &f
      &f Стᴀтус: &6ᴀктивно
      &f Окончᴀниᴇ чᴇᴘᴇз: &6$duration.
      &f
    error_no_history: '&f &fИстоᴘии нᴇ нᴀйдᴇнᴀ.'
    unban_entry: $executor&f снял игᴘовой бᴀн с игᴘокᴀ &6$player&f
    unmute_entry: $executor&f снял бᴀн чᴀтᴀ с игᴘокᴀ &6$player&f
    expired_suffix: ' &f(Пᴘошло)'
    error_no_user: User not found.
    error_no_loginrecord: User has not joined before.
    unwarn_entry: |2-

       &f$name was &7unwarned &fby $executor: '&7$removalReason&f'
  checkban:
    usage: '&f &f/checkban (Игᴘок)'
    no_ban: '&f &fИгᴘок &6$target&f нᴇ зᴀбᴀнᴇн.'
    banned: |-
