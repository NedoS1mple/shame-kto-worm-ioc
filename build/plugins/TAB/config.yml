header-footer:
  enabled: true
  designs:
    world-world1:
      display-condition: '%world%=world1'
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world-world2;world3:
      display-condition: '%world%=world2|%world%=world3'
      header:
      - This is a shared header for
      - world2 and world3
      footer: []
    server-server1:
      display-condition: '%server%=server1'
      header:
      - an example of server with custom header
      footer: []
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&x&a&3&0&0&0&0╔&x&d&1&0&0&0&0═&x&f&f&0&0&0&0═                           &x&f&f&0&0&0&0═&x&d&1&0&0&0&0═&x&a&3&0&0&0&0╗'
      - '&#ea0000&l⚡  %triton_server.name1%  &#ea0000&l⚡'
      - '&fРежим: #fb0000Анархия-101'
      - ''
      footer:
      - ''
      - '%animation:Welcome%'
      - '%animation:Welcome2%'
      - '&x&a&3&0&0&0&0╚&x&d&1&0&0&0&0═&x&f&f&0&0&0&0═                           &x&f&f&0&0&0&0═&x&d&1&0&0&0&0═&x&a&3&0&0&0&0╝'
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:owner,gl.admin,tex.admin,admin,glmoderator,moderator,helper,yt,gercog,knyaz,princ,titan,elite,glava,squid,aspid,hero,strazh,baron,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: true
  disable-condition: '%world%=spawn'
  fancy-value-default: NPC
  fancy-value: '&cЗдоровья'
  value: '%health%'
  title: '&cЗдоровья'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bwww.domain.com'
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  use-numbers: false
  static-number: 0
  delay-on-join-milliseconds: 0
  scoreboards:
    anarchy:
      title: '&x&F&C&8&A&1&A&l⚡ &x&F&C&1&A&1&AА&x&F&C&1&A&1&Aн&x&F&C&1&A&1&Aа&x&F&C&1&A&1&Aр&x&F&C&1&A&1&Aх&x&F&C&1&A&1&Aи&x&F&C&1&A&1&Aя&x&F&C&1&A&1&A-&x&F&C&1&A&1&A1&x&F&C&1&A&1&A0&x&F&C&1&A&1&A1'
      lines:
