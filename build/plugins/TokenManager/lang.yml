# DO NOT EDIT THIS VALUE!
config-version: 8

# Define placeholders usable in any message below.
# Example: Adding 'PREFIX: "[Cool]"' below and then putting '{PREFIX}' in a message will display '[Cool]' when the message is sent in game.
STRINGS:
  PREFIX: '&x&f&a&7&f&0&0[⚝]'
  HEADER: '&8&m*]----------[*&r &9T&boken&9M&banager &8&m*]----------[*&r'
  FOOTER: '&8&m*]------------------------------------[*&r'

ERROR:
  no-permission: '&cУ вас недостаточно прав.'
  invalid-amount: '&c''%input%'' is not a valid amount!'
  player-not-found: '&cPlayer ''%input%'' is not online.'
  shop-not-found: '&cShop ''%input%'' does not exist.'
  invalid-sub-command: '&x&f&a&7&f&0&0[⚠] &cВведена неизвестная команда.'
  balance-not-enough: '&cNot enough tokens! You need %needed% tokens more.'
  data-not-enough: '&cNot enough data found to display the top token balances.'
  on-click-cooldown: '&cYou''re clicking too fast! Try with a little delay. (%remaining%)'
  target-is-self: '&cYou cannot send tokens to yourself.'
  target-has-same-ip: '&cYou cannot send tokens to this player. (alt prevention)'
  no-item-in-hand: '&cYou must be holding an item to do this.'
  item-is-worthless: '&cNo worth has been defined for this item.'
  inventory-is-full: '&cYour inventory is full!'
  not-enough-space: '&cYou need at least %slots% empty inventory slots to do this.'
  on-slot-cancel: '&cYou cannot purchase this item again.'

COMMAND:
  token:
    usage:
    - '{HEADER}'
    - '&fYour token balance: &b%tokens% tokens'
    - '&b/token balance &9<&busername&9> &8» &fCheck people''s token balance.'
    - '&b/token send &9<&busername&9> <&bamount&9> &8» &fSend tokens to players.'
    - '&b/token shop &9<&bname&9> &8» &fOpens selected shop.'
    - '&b/token shops &8» &fDisplays a list of loaded shops.'
    - '&b/token sell <all> &8» &fConverts your held item or the entire inventory to tokens.'
    - '&b/token worth <all> &8» &fShows the worth of your held item or the entire inventory.'
    - '&b/token top &8» &fDisplays the top token balances.'
    - '{FOOTER}'

    send: '{PREFIX} &fSent &b%amount% tokens &fto %player%.'
    receive: '{PREFIX} &fReceived &b%amount% tokens &ffrom %player%.'
    balance: '{PREFIX} &fYour token balance is &b%tokens% token(s)&f.'
    balance-other: '{PREFIX} &f%player%''s token balance is &b%tokens% token(s)&f.'
    balance-top:
      next-update: '{PREFIX} &fNext update: &b%remaining%'
      header: '&8&m*]------[*&r &fTop &b10 &fbalances &8&m*]------[*&r'
      display-format: '&f%rank%. &b%name% &fwith &b%tokens% token(s)'
      footer: '&8&m*]------------------------------[*&r'
    shops: '{PREFIX} &fShops: &b%shops%'
    sell: '{PREFIX} &fSold &f%item_type% (&ax%item_amount%&f) &ffor &b%amount% tokens&f.'
    sell-all: '{PREFIX} &fSold &f%item_amount% item(s) &ffor &b%amount% tokens&f.'
    worth: '{PREFIX} &f%item_type% (&ax%item_amount%&f) &fis worth &b%amount% tokens&f. Type &f/token sell &fto sell this item.'
    worth-all:
      item-format: '&a%item_type% (x%item_amount%): &l+%amount% tokens'
      total: '{PREFIX} &fYour inventory &f(%item_amount% items) &fis worth &b%amount% tokens&f. Type &f/token sell all &fto sell your inventory.'

  tokenmanager:
    usage:
    - '{HEADER}'
    - '&fRequired permission: &ctokenmanager.admin'
    - '&b/tokenmanager add &9<&busername&9> <&bamount&9> &8» &fAdd tokens to player.'
    - '&b/tokenmanager remove &9<&busername&9> <&bamount&9> &8» &fRemove tokens from player.'
    - '&b/tokenmanager set &9<&busername&9> <&bamount&9> &8» &fSet tokens of a player.'
    - '&b/tokenmanager open &9<&busername&9> &9<&bname&9> &8» &fOpen a shop for player.'
    - '&b/tokenmanager giveall &9<&bamount&9> &8» &fGives amount of tokens to online players.'
    - '&b/tokenmanager transfer &8» &fMySQL enabled: data.yml -> db. Flatfile enabled: db -> sqldump.yml'
    - '&b/tokenmanager reload &8» &fReloads the plugin.'
    - '{FOOTER}'

    add: '{PREFIX} &fБыло добавлено: &6%amount% КБ &f(Подробнее &e/cashback&f)'
    remove: '{PREFIX} &fБыло списано: &6%amount% КБ'
    set: '{PREFIX} &fSet %player%''s tokens to &b%amount% tokens&f.'
    giveall: '{PREFIX} &fGave &b%amount% tokens &fto &b%players% &fplayers.'
    open: '{PREFIX} &fOpened shop &b%name% &ffor %player%.'

  sub-command-usage: '{PREFIX} &fUsage of this sub command is ''&b/%command% %usage%&f''.'
  add: '{PREFIX} &fБыло добавлено: &6%amount% КБ &f(Подробнее &e/cashback&f)'
  remove: '{PREFIX} &fБыло списано: &6%amount% КБ'

PLACEHOLDER:
  rank:
    loading: 'Loading...'
    no-data: 'No data'
    unranked: 'Unranked'
  top:
    loading: 'Loading...'
    no-data: 'No data'