# Плагин: mcAntiReLog (Анти-релог)
# Версия: 1.8+
#
# Описание:
# Плагин добавляет анти-релок, если игрок ударил друго игрока запускается таймер.
# Если таймер всех с кем идет бой не истек и игрок вышел из игры, он умирает.
# Если идет бой, то на игрока действуеют задержки "кд" на перки (эндер перлы, яблоки).
# Есть возможность полного отключения анти-релога для конкретных миров.
#
# Зависимости: (плагины без которых этот работать не будет)
# - UtilM https://mvn.vepvep.com/minecraft/me/socrum/minecraft/spigot/plugin/utilm (utilm-x.x.x-jar-with-dependencies.jar)
#
# Опциональные зависимости: (плагины без которых не будет полного функционала, но работать будет)
# - PlaceholdersAPI https://www.spigotmc.org/resources/placeholderapi.6245/
#
# Плейсхоледры:
# %antirelog_global_timer% - Таймер времени действия боя с момента последнего удара.
#
# %antirelog_target_player_name_1% - Никнейм первого в списке игрока с которым идет бой.
# %antirelog_target_player_name_2% - Никнейм второго в списке игрока с которым идет бой.
# %antirelog_target_player_name_...% - т.д.
#
# %antirelog_target_player_health_1% - Здоровье первого в списке игрока с которым идет бой.
# %antirelog_target_player_health_2% - Здоровье второго в списке игрока с которым идет бой.
# %antirelog_target_player_health_...% - т.д.
#
# %antirelog_target_player_timer_1% - Таймер первого в списке игрока с которым идет бой.
# %antirelog_target_player_timer_2% - Таймер второго в списке игрока с которым идет бой.
# %antirelog_target_player_timer_...% - т.д.
#
# %antirelog_target_player_ping_1% - Пинг первого в списке игрока с которым идет бой.
# %antirelog_target_player_ping_2% - Пинг второго в списке игрока с которым идет бой.
# %antirelog_target_player_ping_...% - т.д.

message:
  command_is_not_allowed_in_combat: '&cНельзя использовать команды в режиме PVP.'
  cooldown: '&cВы сможете использовать это через &b%cooldown% &cсек.'
  reload_success: '&aПлагин перезагружен!'
  permission_denied: '&cОтказано в доступе.'
  help:
    - '&e/antirelog reload &7- перезагрузить плагин'
    - '&e/antirelog help &7- показать список команд'

permission:
  reload: antirelog.reload # Разрешение на перезагрузку этого плагина.

# Список миров в которых не действует режим анти-релог.
# Цели боя не будут добавляться в список, а при выходе
# из игры во время боя игрок не умрет, кд на перках нет.
disabled_world_list:
  - 'world-1'
  - 'world-2'

pvp_mode:

  # Кастомизация оповещения о входе в режим PVP.
  pvp_mode_enabled:
    message: '&c&c&lВы вошли в режим PVP! Не выходите из игры, иначе умрете!' # Оставьте сообщение пустым, чтобы не показывать.
    title:
      enable: true # Показывать этот тайтл?
      title: '&c&lВы вошли в режим PVP!'
      subtitle: '&cНе выходите из игры!'
      in: 20 # Тиков. (1 секунда = 20 тиков) Время появления.
      stay: 20 # Тиков. (1 секунда = 20 тиков) Время отображения.
      out: 20 # Тиков. (1 секунда = 20 тиков) Время исчезновения.
    action_bar:
      enable: true # Показывать это сообщение в экшен-баре?
      message: '&c&lВы вошли в режим PVP!'

  # Кастомизация оповещения о выходе из режима PVP.
  pvp_mode_disabled:
    message: '&a&lВы вышли из режима PVP! Можно выходить из игры не умерев!'
    title:
      enable: true
      title: '&a&lВы вышли из режима PVP!'
      subtitle: '&aМожно выходить из игры!'
      in: 20
      stay: 20
      out: 20
    action_bar:
      enable: true
      message: '&a&lВы вышли из режима PVP!'

pvp_timer: 30 # Время действия режима PVP.

ender_pearl_cooldown:
  cooldown: 15 # (Сек.) Время задержки до следующего использоваться эндер перла во время боя.

