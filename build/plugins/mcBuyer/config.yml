# Плагин: mcBuyer (Продавай, прокачивайся, продавай)
# Версия: 1.8+
#
# Описание:
# Плагин добавляет скупщика с поуровневой
# прокачкой, продавай чтобы повысить уровень.
#
# Зависимости: (плагины без которых этот работать не будет)
# - UtilM https://mcdev.su/resources/utilm.73/
# - Vault https://www.spigotmc.org/resources/vault.34315/
#
# Опциональные зависимости: (плагины без которых не будет полного функционала, но работать будет)
# - PlaceholdersAPI https://www.spigotmc.org/resources/placeholderapi.6245/
# - mcEconomy https://mcdev.su/resources/mceconomy-krosservernyye-mul-ti-valyuty.250/
#
# Плейсхоледры:
#
# Время последнего обновления лидерборда.
# Конфигурируемый, подробнее в секии "leaderboard.last_update".
# %mcbuyer_leaderboard_last_update%
#
# Время до следующего обновления лидерборда по числу продаж.
# Конфигурируемый, подробнее в секии "leaderboard.time_to_update".
# %mcbuyer_leaderboard_time_to_update%
#
# Никнейм игрока на позиции N, где N номер позиции в топе (всего 10 позиций).
# Конфигурируемый, подробнее в секии  "leaderboard.placeholder.player_name".
# %mcbuyer_leaderboard_position_N_player_name%
#
# Форматированная запись рекорда, например "1. Steve - Продано предметов: 1,220".
# Конфигурируемый, подробнее в секии  "leaderboard.placeholder.record_string".
# %mcbuyer_leaderboard_position_N_record_string%

message:
  reload_success: '&2&l✔ &7| &aПлагин перезагружен!'
  permission_denied: '&4&l✘ &7| &cОтказано в доступе.'
  items_sold: ' &fx%items_sold% &7%item_display_name%&r #ffccccпродано за %currency_color_string%%currency_sign%%total%&e.'
  you_dont_have_an_item: '&4&l✘ &7| &cТакого предмета нет в инвентаре чтобы продать его.'
  catalog_doesnt_exist: '&4&l✘ &7| &cКаталога с таким ID не существует.'
  everything_sold: "&2&l✔ &7| &aВсё продано!"
  nothing_to_sell: "&4&l✘ &7| &cНечего продавать."
  select_all_cancelled: "&2&l✔ &7| &aВыбор всего отменён!"
  all_selected: "&e● &7| &aВыбрано всё!"
  item_now_auto_purchasable_status: "&a● &7| #ffccccТеперь этот предмет %item_display_name%&r #ffccccавто-скупаем &r%item_auto_sell_status%#ffcccc!"
  price_grow: "&6&l⬀ &7| &eСкупщик повысил цену на &r%price_display_name%&r&e, &c%current_price% &e→ &a%new_price% &6(%grow_percent%%)&e."
  help:
    - '#ffcccc/buyer reload &f- перезагрузить плагин'
    - '#ffcccc/buyer help &f- показать список команд'
    - '#ffcccc/buyer &f- открыть меню скупщика'
    - '#ffcccc/buyer #f52080(ID каталога) (true#ffcccc/#f52080false) &f- открыть каталог скупщика'

permission:
  reload: buyer.reload # Разрешение на перезагрузку этого плагина.

price_changer_module:
  price_changer:
    # Тип изменителя цен:
    # GROW_ALL - Каждый интервал времени повышает все DYNAMIC цены. Оставьте 'message.price_grow: ""' пустым чтобы предотвратить пововещение о повышении цен.
    # GROW_LOWER - Каждый интервал времени повышает одну минимальную DYNAMIC цену.
    type: GROW_ALL
    interval_seconds: 600 # (Сек.) Интервал роста цен.

    # Пример конфигурации для типа GROW_LOWER.
    # type: GROW_LOWER
    # interval_seconds: 30 # (Сек.) Интервал роста цены.

multiplier_list: # Список мультиприкаторов.
  multiplier_1: # ID мультиприкатора.
    permission: "buyer.multiplier_1" # Разрешение, чтобы начал действовать.
    addition_multiplier_value: 0.5 # Это значение будет прибавлено к обычному мультипликатору каталога, а не дважды умножено.
  multiplier_2:
    permission: "buyer.multiplier_2"
    addition_multiplier_value: 1.0

vault:
  currency_color_string: "&a" # Цвет валюты Vault.
  currency_sign: "$" # Символ валюты Vault.

price_changer:
  # true - все цены типа DYNAMIC будут изменять согласно конфигурации.
  # false - все цены типа DYNAMIC примут значение amount.value и не будут изменяться.
  enable: true

price_graph:
  columns: 32 # Число колонок (столбцов).
  rows: 12 # Число строк (линий).
  marker:
    grid: "§0❚" # Пустая клетка.
    grow_line: "§a❚" # Линия роста цены.
    drop_line: "§c❚" # Линия падения цены.
    point: "§a❚" # Зафиксированная точка на момент записи актуальной цены в историю.
    actual_point: "§d❚" # Актуальная точка цены на данный момент (динамическая, не из истории).
  label:
    prefix: "%currency_color_string%%currency_sign%" # Префикс метки линии.
    suffix: "" # Суффикс метки линии.

auto_buyer:
  # Автоматически продавать выбранные в "Авто-скупщике" предметы если игрок открыл меню mcBuyer?
  # По умолчанию выключено и требует нажатия кнопки "Продать всё" в меню "Авто-скупщика".
  # Вы можете изменить описание этой кнопки, секция "gui.auto_buyer.auto_sell.item.description".
  enable_auto_sell: false

leaderboard:
  placeholder:
    player_name:
      value: "%player_name%"
      empty_value: "Пусто"
    record_string:
      value: "&e%position%. &b%player_name% &e%score%"
      empty_value: "&e%position%. &7Пусто"

  # (Сек.) Интервал обновления топа.
  update_interval_seconds: 60

  last_update:
    # Формат плейсхолдера.
    string: "&fОбновлено: &a%date%"
    # Формат времени.
    # Полный список форматов времени можно найти по адресу: https://docs.oracle.com/javase/7/docs/api/java/text/SimpleDateFormat.html.
    date_format: "EEEE, dd MMM yyyy"

  time_to_update:
    # Формат плейсхолдера.
    string: "&fОбновится через: %time%"
    # Цвет цифр.
    # Полный список цветов можно найти по адресу: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/ChatColor.html.
    number_color: GREEN
    # Цвет аббревиатур (час. мин. сек. и т.д.).
    abbreviation_color: WHITE

selected_sell_mode:
  selected: '&a✔'
  unselected: '#ffcccc☐'
  description:
    - '#ffccccРежим скупки:'
    - '%sell_mode_1_status% #f520801 #ffccccшт.'
    - '%sell_mode_16_status% #f5208016 #ffccccшт.'
    - '%sell_mode_64_status% #f5208064 #ffccccшт.'
    - '%sell_mode_all_status% #f52080ВСЕ'

selected_auto_sell_mode:
  selected: "&aДа"
  unselected: "&cНет"
  description:
    - "#ffccccАвто-скупка: %auto_sell_mode%"
    - ""
    - "&eКликните чтобы изменить!"

