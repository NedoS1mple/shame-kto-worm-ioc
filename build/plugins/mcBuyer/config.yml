##################################################### КАТАЛОГИ

# Список каталогов с продаваемыми предметами.
catalog_list:
  catalog_1: # ID каталога с продаваемыми предметами.

    # Формула расчета уровня каталога от числа проданных предметов этого каталога.
    #
    # По умолчанию:
    # Каждые 10 проданных предметов это +1 уровень.
    #
    # (1 - 1) * 10 = 0 - (1-й уровень требует 0 проданных предметов)
    # (2 - 1) * 10 = 10 - (2-й уровень требует 10 проданных предметов)
    # (3 - 1) * 10 = 20 - (3-й уровень требует 20 проданных предметов)
    level_formula: '(%level% - 1) * 10'

    # Максимальный уровень выше которого он не поднимется.
    max_level: 100

    # Формула расчета множителя дохода от уровня этого каталога.
    #
    # По умолчанию:
    # Каждый уровень дает +0.01 к множитею дохода к продаваемому предмету.
    #
    # 1 + 1 / 100 = 1.01
    # 1 + 2 / 100 = 1.02
    # 1 + 3 / 100 = 1.03
    # ...
    # 1 + 100 / 100 = 2
    # ...
    multiplier_formula: '1 + %catalog_level% / 100'

    item_visualization:
      material: CARROT
      display_name: '&fФермерство и растения'
      description:
        - '#ffccccУровень: &6%catalog_level%#ffcccc/&6%catalog_max_level%'
        - '#ffccccПрогресс: &2%items_sold%#ffcccc/&2%required_items_sold%'
        - '#ffccccМножитель: &bx%catalog_multiplier%'
        - ''
        - '&eКликните чтобы открыть это меню!'
    # Список ID скупаемых предметов этого каталога.
