# Плагин: mcItems (Кастомные предметы)
# Версия: 1.8+
#
# Описание:
# Плагин добавляет кастомные предметы.
#
# Зависимости: (плагины без которых этот работать не будет)
# - UtilM https://mcdev.su/resources/utilm.73/)
#
# Опциональные зависимости: (плагины без которых не будет полного функционала, но работать будет)
# - WorldEdit https://dev.bukkit.org/projects/worldedit (не нужен в случае если не используются способности задействующие этот плагин)
# - WorldGuard https://dev.bukkit.org/projects/worldguard (не нужен в случае если не используются способности задействующие этот плагин)
# - mcRegion https://mcdev.su/resources/mcregion-privat-bloki.126/ (не нужен в случае если нет необходимости проверять места призыва .schematic/.schema исключая их призыв в регионах-блоках)

message:
  permission_denied: "&cОтказано в доступе."
  player_is_not_online: "&cЭтот игрок сейчас не онлайн."
  specified_item_id_does_not_exist: "&cПредмет с таким ID '&b%item_id%&c' не существует."
  success: "&aУспешно!"
  player_does_not_have_specified_item: "&cУ игрока нет указанного предмета."
  you_can_not_place_other_damageblock: "&cНельзя размещать блок дамагера рядом с другим блоком дамагера ближе чем на &b%blocks% &cблока."
  you_can_not_place_other_chunkloaderblock: "&cНельзя размещать блок прогрузчика чанков рядом с другим блоком прогрузчика чанков ближе чем на &b%blocks% &cблока."
  help:
    - "&e/mcitems help &7- показать список команд"
    - "&e/mcitems list &7- показать список предметов"
    - "&e/mcitems item (ник игрока онлайн) give (ID предмета) &7- выдать игроку предмет"
    - "&e/mcitems item (ник игрока онлайн) take (ID предмета) &7- забрать предмет у игрока"

permission:
  list: items.list # Разрешение на просмоторт списка и получение предметов.
  give: items.give # Разрешение на выдачу предмета.
  take: items.take # Разрешение на изъятие предмета.

# (Блоков).
# Минимальная дистанция между блоками "Дамагера" при размещении.
# Нельзя установить еще один блок "Дамагера" рядом с другим в этом радиусе.
# Установите значение "-1" чтобы отключить это ограничение.
min_distance_between_damagerblock_blocks: 3

# (Блоков).
# Минимальная дистанция между блоками "Прогрузчика чанков" при размещении.
# Нельзя установить еще один блок "Прогрузчика чанков" рядом с другим в этом радиусе.
# Установите значение "-1" чтобы отключить это ограничение.
min_distance_between_chunkloaderblock_blocks: 32

