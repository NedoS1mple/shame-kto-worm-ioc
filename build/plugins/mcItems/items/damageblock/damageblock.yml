component_list:
  damageblock_component:
    # Блок который будет установлен.
    to_place_blockm:
      # Используйте материалы версии ядра на котором запускаете плагин.
      # Списки всех материалов для каждой версии:
      # https://helpch.at/docs/1.8.8/org/bukkit/Material.html
      # https://helpch.at/docs/x.x.x/org/bukkit/Material.html
      # ...
      material: JIGSAW
    # Радиус атаки.
    radius: 3
    # Сила атаки. 2 еденицы = 1 сердечко обычного игрока.
    damage: 2

    # Источник партиклов, специального эффекта.
    particle_emitter:
      type: RISING_SPHERE # Тип.
      radius: 3 # Радиус.
      density: 300 # Кучность/число частиц.
      animation_duration_ticks: 30 # (Тиков. 20 тиков = 1 сек.) Продолжительность 1 цикла анимации.
      particle_hex_color: "#FF0000" # HEX Цвет партиклов.
      spawn_offset_x: 0.5 # Смещение центра источника партиклов по X относительно места вставки .schem файла.
      spawn_offset_y: 0.5 # Смещение центра источника партиклов по Y относительно места вставки .schem файла.
      spawn_offset_z: 0.5 # Смещение центра источника партиклов по Z относительно места вставки .schem файла.

    # Активировать запрет миров на использование этой способности?
    enable_deny_worlds: true
    # Список миров в которых нельзя использовать эту способсность.
    deny_world_name_list:
      - "nether"
      - "end"
    # Список WorldGuard регионов в которых нельзя использовать эту способность.
    # Если плагин WorldGuard не установлен, конфигурация будет проигнорирована.
    deny_world_guard_region_name_list:
      - "example-worldguard-region-name"

    message:
      use_deny_world: "&cВ этом мире этот предмет не работает."
      is_intersecting_with_one_of_worldguard_deny_region: "&cМесто выполнения способности будет пересекать запрещенный регион, способность не сработает."
      is_not_allowed_to_use_because_of_mcitems_deny_flag: "&cМесто выполнения способности будет пересекать регион с выключенным флагом mcitems, способность не сработает."
