open_menu_command_list:
  - "tcolor"

access_to_open_checker:
  enable: false
  permission: menu.open.shop_weapon
  message:
    permission_denied: "&cОтказано в доступе на открытие меню 1."

# Заголовок меню.
title: "#D74444&l❖ #ff6600&lЦвет тэга"

# (Тиков 20 тиков = 1 сек.) Интервал перерисовки меню.
# Значения 0 и ниже включая -1 и тд. отключают отрисовку за исключением случаев когда игрок кликает (оптимизация).
update_interval_ticks: 0

# Макет меню.
layout:

  # Сетка макета.
  grid:
    - "| | - - A - - | |"
    - "| B C D E F G H |"
    - "| I J K L M N O |"
    - "| P Q . . . . . |"
    - "| | - - - - - | |"

  layout_item_list:
    layout_item_1:
      placeholder: "A"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: tipped_arrow
            display_name: "#fb0000[⟲] #ff6600Вернуться.."
            description:
              - "&7[Вернуться к разделам]"
      click_pipeline_component_list:
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - design
        play_sound:
          type: PLAY_SOUND
          play:
            sound: minecraft:block.note_block.bit
            sound_category: MASTER
            volume: 1.0
            pitch: 1.0

    layout_item_2:
      placeholder: "B"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: lime_dye
            display_name: "#ffff00Убрать цвет"
            description:
              - "#FFFFE6Нажми, чтобы установить"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list:
            - mycmd-playerdata set_silent %player_name% tcolor 0
        send_message:
          type: SEND_MESSAGE
          message: "#FFFFE6Установлено"
        play_sound:
          type: PLAY_SOUND
          play:
            sound: CLICK
            sound_category: MASTER
            volume: 1.0
            pitch: 1.0

    layout_item_3:
      placeholder: "C"
      render_pipeline_component_list:
        component_1:
          # Компонент проверяющий у наблюдающего его наличие разрешения.
          type: CHECK_PERMISSION

          # Проверяемое разрешение.
          permission: "tcolor.2"

          # Любой "type: CHECK_PERMISSION" компонент может иметь список из
          # "permission_denied_render_pipeline_component_list" компонентов.
          # Это замечательно когда например необходимо при отсутствии разрешения
          # отрисовать другую цепочку компонентов или например отобразить другой предмет.
          permission_denied_render_pipeline_component_list:
            component_4:
              type: HUMAN_READABLE_ITEM
              item:
                material: red_dye
                display_name: "#ffff00Цвет: &a[ЦВЕТ]"
                description:
                  - "#FF0000&m                        "
                  - "#00FF00 $#FFFFE6 Цена:#00FF00 790 ТК"
                  - "#009900 ⛁#FFFFE6 Баланс: #FF6600%playerpoints_points% ТК"
                  - "#FF0000&m                        "
        component_2:
          type: HUMAN_READABLE_ITEM
          item:
            material: lime_dye
            display_name: "#ffff00Цвет: &a[ЦВЕТ]"
            description:
              - "#FFFFE6Нажми, чтобы установить"

      click_pipeline_component_list:
        component_1:
          type: CHECK_PERMISSION
          permission: "tcolor.2"
          permission_denied_click_pipeline_component_list:
              component_3:
                type: PLAYER_POINTS_HAS_MONEY
                currency_id: dummy
                amount: 790
                not_enough_money_click_pipeline_component_list:
                  component_6:
                    type: SEND_MESSAGE
                    message: 
                      - " #fb0000[✘] Ошибка! #FFFFE6У Вас не хватает #00FF00Токенов#FFFFE6!"
                      - " &r&r     &fНе беда, их можно купить на %triton_server.name1%"
              component_4:
                type: PLAYER_POINTS_WITHDRAW_MONEY
                currency_id: dummy
                amount: 790
              component_5:
                type: INVOKE_CONSOLE_COMMAND_LIST
                console_command_list:
                  - lp user %player_name% permission set tcolor.2 true
              send_message:
                type: SEND_MESSAGE
                message: 
                  - ""
                  - "&a[✔] Успешная покупка!"
                  - ""
        component_2:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list:
            - mycmd-playerdata set_silent %player_name% tcolor 2
        send_message:
          type: SEND_MESSAGE
          message: 
            - ""
            - "#FFFFE6Установлено"
            - ""

