open_menu_command_list:
  - "skup"
  - "buyer"

access_to_open_checker:
  enable: false
  permission: menu.open.shop_weapon
  message:
    permission_denied: "&cОтказано в доступе на открытие меню 1."

# Заголовок меню.
title: "&r&l#cc0000❖&r&l#ff6600 Выберите секцию&r"

# (Тиков 20 тиков = 1 сек.) Интервал перерисовки меню.
# Значения 0 и ниже включая -1 и тд. отключают отрисовку за исключением случаев когда игрок кликает (оптимизация).
update_interval_ticks: 0

# Макет меню.
layout:

  # Сетка макета.
  grid:
    - "| | - - - - - | |"
    - "| - - . A . - - |"
    - "| - . B . C . - |"
    - "| - - . D . - - |"
    - "| | - - - - - | |"

  layout_item_list:
    layout_item_1:
      placeholder: "A"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: cactus
            display_name: "&r#ff0000❖&r#ff6600 Фермер&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - "mcbuyer catalog_1 false"
        play_sound:
          type: PLAY_SOUND
          play:
            sound: minecraft:block.note_block.bit
            sound_category: MASTER
            volume: 1.0
            pitch: 1.0

    layout_item_2:
      placeholder: "B"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: cooked_mutton
            display_name: "&r#ff0000❖&r#ff6600 Еда&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - "mcbuyer catalog_3 false"
        play_sound:
          type: PLAY_SOUND
          play:
            sound: CLICK
            sound_category: MASTER
            volume: 1.0
            pitch: 1.0

    layout_item_4:
      placeholder: "C"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: EMERALD
            display_name: "&r#ff0000❖&r#ff6600 Ресурсы&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - "mcbuyer catalog_4 false"
        play_sound:
          type: PLAY_SOUND
