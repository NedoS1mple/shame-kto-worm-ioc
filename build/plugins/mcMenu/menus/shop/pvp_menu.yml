  # Сетка макета.
  grid:
    - "| | | | A | | | |"
    - "| - - B - F - - |"
    - "| - X C - G X1 - |"
    - "| - Y D - H Y1 - |"
    - "| - Z E - I Z1 - |"
    - "| | | | | | | | |"

