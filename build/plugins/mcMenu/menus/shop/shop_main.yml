open_menu_command_list:
  - "shop"

access_to_open_checker:
  enable: false
  permission: menu.open.shop_weapon
  message:
    permission_denied: "&cОтказано в доступе на открытие меню 1."

# Заголовок меню.
title: "&r&l#cc0000❖&r&l#ff6600 Выберите Магазин:"

# (Тиков 20 тиков = 1 сек.) Интервал перерисовки меню.
# Значения 0 и ниже включая -1 и тд. отключают отрисовку за исключением случаев когда игрок кликает (оптимизация).
update_interval_ticks: 0

# Макет меню.
layout:

  # Сетка макета.
  grid:
    - "| | - - - - - | |"
    - "| - - . A . - - |"
    - "| - . B . C . - |"
    - "| - - . D . - - |"
    - "| | - - - - - | |"

  layout_item_list:
    layout_item_1:
      placeholder: "A"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: pufferfish
            display_name: "&9❖ Скупка ресурсов&r"
            description:
              - "&r#ffffe6Меню с большим выбором&r"
              - "&r#ffffe6продажи своих ресурсов&r"
      click_pipeline_component_list:
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - skup
        play_sound:
          type: PLAY_SOUND
          play:
            sound: minecraft:block.note_block.bit
            sound_category: MASTER
            volume: 1.0
            pitch: 1.0

    layout_item_2:
      placeholder: "B"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: gold_ingot
            display_name: "&r#ff0000❖&r#ff6600 Магазин Сервера&r"
            description:
              - "&r#ffffe6Обычный магазин как&r"
              - "&r#ffffe6хлебная будка у вас&r"
              - "&r#ffffe6недалеко от дома&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - luckymoney

    layout_item_3:
      placeholder: "C"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: emerald
            display_name: "&a❖ Токен Магазин&r"
            description:
              - "&r#ffffe6Магазин для Элитных&r"
              - "&r#ffffe6игроков. В продаже товары&r"
              - "&r#ffffe6только за валюту Токены&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - donshop

    layout_item_4:
      placeholder: "D"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: totem_of_undying
            display_name: "&r#ff6600❖&r#ffff00 Аукционы&r"
            description:
              - "&r#ffffe6Торгуйся между игроками&r"
              - "&r#ffffe6покупай ресурсы или&r"
              - "&r#ffffe6продавай свои.&r"
      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list:
            - ah

    layout_item_22:
      placeholder: "|"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: RED_STAINED_GLASS_PANE
            display_name: "%triton_server.name1%"

      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
          
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list: []

    layout_item_23:
      placeholder: "-"
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: ORANGE_STAINED_GLASS_PANE
            display_name: "%triton_server.name1%"

      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
          
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list: []

    layout_item_25:
      placeholder: "."
      render_pipeline_component_list:
        render_pipeline_component_1:
          type: HUMAN_READABLE_ITEM
          item:
            material: LIGHT_GRAY_STAINED_GLASS_PANE
            display_name: "%triton_server.name1%"

      click_pipeline_component_list:
        invoke_console_command_list:
          type: INVOKE_CONSOLE_COMMAND_LIST
          console_command_list: []
          
        invoke_player_command_list:
          type: INVOKE_PLAYER_COMMAND_LIST
          player_command_list: []